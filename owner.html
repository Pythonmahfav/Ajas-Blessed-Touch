<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ajas Blessed Touch | Owner Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f3fb;
      color: #241b28;
    }

    .login-box,
    .dashboard {
      max-width: 1000px;
      margin: 50px auto;
      padding: 25px;
    }

    .login-card {
      max-width: 420px;
      margin: 80px auto;
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      color: #8b4bb3;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .login-btn {
      width: 100%;
      margin-top: 20px;
      background: #8b4bb3;
      color: white;
    }

    .logout-btn {
      background: #eee;
      color: #333;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .booking-card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .booking-card h3 {
      margin-top: 0;
      color: #8b4bb3;
    }

    .booking-info {
      line-height: 1.7;
    }

    .status {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #fff3cd;
      color: #856404;
      font-size: 13px;
      font-weight: bold;
    }
    .booking-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    
    .confirm-btn {
      background: #8b4bb3;
      color: white;
    }
    
    .decline-btn {
      background: #eee;
      color: #333;
    }
    .remove-availability-btn {
      background: #f3dff8;
      color: #8b4bb3;
      margin-top: 12px;
    }
    
    .remove-availability-btn:hover {
      opacity: 0.85;
    }
    
    .confirm-btn:hover,
    .decline-btn:hover {
      opacity: 0.85;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #c62828;
      margin-top: 12px;
    }

    .empty {
      background: white;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      color: #777;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginSection" class="login-card">

    <h1>Ajas Blessed Touch</h1>

    <p class="subtitle">
      Owner Dashboard
    </p>

    <label for="email">Email</label>
    <input
      type="email"
      id="email"
      placeholder="Owner email"
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button class="login-btn" id="loginBtn">
      Login
    </button>

    <p id="loginError" class="error"></p>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboardSection" class="dashboard hidden">

    <div class="availability-manager">

  <h2>📅 Manage Availability</h2>

  <p>Add the dates and times you are available for appointments.</p>

  <label for="availabilityDate">Available Date</label>
  <input type="date" id="availabilityDate">

  <h3>Available Times</h3>

  <div class="availability-times">

    <label>
      <input type="checkbox" value="9:00 AM">
      9:00 AM
    </label>

    <label>
      <input type="checkbox" value="10:00 AM">
      10:00 AM
    </label>

    <label>
      <input type="checkbox" value="11:00 AM">
      11:00 AM
    </label>

    <label>
      <input type="checkbox" value="12:00 PM">
      12:00 PM
    </label>

    <label>
      <input type="checkbox" value="1:00 PM">
      1:00 PM
    </label>

    <label>
      <input type="checkbox" value="2:00 PM">
      2:00 PM
    </label>

    <label>
      <input type="checkbox" value="3:00 PM">
      3:00 PM
    </label>

    <label>
      <input type="checkbox" value="4:00 PM">
      4:00 PM
    </label>

  </div>

  <button type="button" id="saveAvailabilityBtn">
    💾 Save Availability
  </button>

  <p id="availabilityMessage"></p>
      <div id="availabilityList">
      <p class="empty">Loading availability...</p>
</div>

</div>

    <div class="top-bar">

      <div>
        <h1>Owner Dashboard 💜</h1>
        <p class="subtitle">
          Manage Ajas Blessed Touch appointments.
        </p>
      </div>

      <button class="logout-btn" id="logoutBtn">
        Logout
      </button>

    </div>

    <h2>Appointments</h2>

    <div id="bookingsList">
      <p class="empty">
        Loading bookings...
      </p>
    </div>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

   import {
    getFirestore,
    collection,
    getDocs,
    updateDoc,
    doc,
    setDoc
  } from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyALsnVzZpzxIyPzKs__Vmtb-xvN3LfJ-TU",
      authDomain: "ajas-blessed-touch.firebaseapp.com",
      projectId: "ajas-blessed-touch",
      storageBucket: "ajas-blessed-touch.firebasestorage.app",
      messagingSenderId: "102521335888",
      appId: "1:102521335888:web:604202416214f80a586155",
      measurementId: "G-MS21KP3ZK3"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);
    const db = getFirestore(app);


    const loginSection =
      document.getElementById("loginSection");

    const dashboardSection =
      document.getElementById("dashboardSection");

    const loginBtn =
      document.getElementById("loginBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const loginError =
      document.getElementById("loginError");

    const bookingsList =
      document.getElementById("bookingsList");


    /* LOGIN */

    loginBtn.addEventListener("click", async () => {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      loginError.textContent = "";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        console.error(error);

        loginError.textContent =
          "Incorrect email or password.";

      }

    });


    /* LOGOUT */

    logoutBtn.addEventListener("click", async () => {

      await signOut(auth);

    });


    /* AUTH STATE */

    onAuthStateChanged(auth, async (user) => {

      if (user) {

        loginSection.classList.add("hidden");
      
        dashboardSection.classList.remove("hidden");
      
        await loadBookings();
      
        await loadAvailabilityList();
      
      } else {

        loginSection.classList.remove("hidden");

        dashboardSection.classList.add("hidden");

      }

    });


    /* LOAD BOOKINGS */

   async function loadBookings() {

  bookingsList.innerHTML =
    '<p class="empty">Loading bookings...</p>';

  try {

    const snapshot =
      await getDocs(collection(db, "bookings"));

    bookingsList.innerHTML = "";

    if (snapshot.empty) {

      bookingsList.innerHTML =
        '<p class="empty">No appointments yet.</p>';

      return;

    }

    snapshot.forEach((bookingDoc) => {

      const booking = bookingDoc.data();

      const card =
        document.createElement("div");

      card.className = "booking-card";

      card.innerHTML = `
        <h3>${booking.name || "Customer"}</h3>

        <div class="booking-info">

          <strong>Phone:</strong>
          ${booking.phone || "N/A"}
          <br>

          <strong>Service:</strong>
          ${booking.service || "N/A"}
          <br>

          <strong>Appointment Type:</strong>
          ${booking.appointmentType || "N/A"}
          <br>

          <strong>Date:</strong>
          ${booking.date || "N/A"}
          <br>

          <strong>Time:</strong>
          ${booking.time || "N/A"}
          <br>

          <strong>Details:</strong>
          ${booking.details || "None"}

          <br>

          <span class="status">
            ${booking.status || "pending"}
          </span>

        </div>

        <div class="booking-actions">

          <button class="confirm-btn">
            ✅ Confirm
          </button>

          <button class="decline-btn">
            ❌ Decline
          </button>

        </div>
      `;

      bookingsList.appendChild(card);


      /* CONFIRM BOOKING */

      const confirmBtn =
        card.querySelector(".confirm-btn");

      confirmBtn.addEventListener("click", async () => {

        try {

          await updateDoc(
            doc(db, "bookings", bookingDoc.id),
            {
              status: "confirmed"
            }
          );

          alert("Booking confirmed! 💜");

          loadBookings();

        } catch (error) {

          console.error("Confirm error:", error);

          alert("Could not confirm this booking.");

        }

      });


      /* DECLINE BOOKING */

      const declineBtn =
        card.querySelector(".decline-btn");

      declineBtn.addEventListener("click", async () => {

        const confirmed =
          confirm("Are you sure you want to decline this booking?");

        if (!confirmed) return;

        try {

          await updateDoc(
            doc(db, "bookings", bookingDoc.id),
            {
              status: "declined"
            }
          );

          alert("Booking declined.");

          loadBookings();

        } catch (error) {

          console.error("Decline error:", error);

          alert("Could not decline this booking.");

        }

      });

    });

  } catch (error) {

    console.error("Load bookings error:", error);

    bookingsList.innerHTML =
      '<p class="error">Unable to load bookings.</p>';

  }

}

    /* SAVE AVAILABILITY */

const saveAvailabilityBtn =
  document.getElementById("saveAvailabilityBtn");

const availabilityMessage =
  document.getElementById("availabilityMessage");

saveAvailabilityBtn.addEventListener("click", async () => {

  const date =
    document.getElementById("availabilityDate").value;

  const selectedTimes =
    Array.from(
      document.querySelectorAll(
        ".availability-times input[type='checkbox']:checked"
      )
    ).map(checkbox => checkbox.value);

  availabilityMessage.textContent = "";

  if (!date) {
    availabilityMessage.textContent =
      "Please choose a date.";
    return;
  }

  if (selectedTimes.length === 0) {
    availabilityMessage.textContent =
      "Please select at least one time.";
    return;
  }

  try {

    await setDoc(
      doc(db, "availability", date),
      {
        date: date,
        times: selectedTimes,
        active: true
      }
    );

    availabilityMessage.textContent =
      "Availability saved successfully! 💜";

  } catch (error) {

    console.error("Save availability error:", error);

    availabilityMessage.textContent =
      "Could not save availability.";

  }

});
    /* LOAD AVAILABILITY */

async function loadAvailabilityList() {

  const availabilityList =
    document.getElementById("availabilityList");

  availabilityList.innerHTML =
    '<p class="empty">Loading availability...</p>';

  try {

    const snapshot =
      await getDocs(collection(db, "availability"));

    availabilityList.innerHTML = "";

    if (snapshot.empty) {

      availabilityList.innerHTML =
        '<p class="empty">No availability added yet.</p>';

      return;
    }

    snapshot.forEach((availabilityDoc) => {

      const data = availabilityDoc.data();

      const card =
        document.createElement("div");

      card.className = "booking-card";

      card.innerHTML = `
        <h3>📅 ${data.date}</h3>

        <p>
          <strong>Available Times:</strong>
          ${data.times.join(", ")}
        </p>

        <button class="remove-availability-btn">
          🗑️ Remove
        </button>
      `;

      availabilityList.appendChild(card);

      const removeBtn =
        card.querySelector(".remove-availability-btn");

      removeBtn.addEventListener("click", async () => {

        const confirmed =
          confirm(
            `Remove availability for ${data.date}?`
          );

        if (!confirmed) return;

        try {

          await updateDoc(
            doc(db, "availability", availabilityDoc.id),
            {
              active: false
            }
          );

          alert("Availability removed. 💜");

          await loadAvailabilityList();

        } catch (error) {

          console.error(
            "Remove availability error:",
            error
          );

          alert("Could not remove availability.");

        }

      });

    });

  } catch (error) {

    console.error(
      "Load availability error:",
      error
    );

    availabilityList.innerHTML =
      '<p class="error">Unable to load availability.</p>';

  }

}
